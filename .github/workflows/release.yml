name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" \
            -o dist/cai-linux-amd64 ./cmd/cai

          GOOS=linux GOARCH=arm64 \
            go build -ldflags="-s -w" \
            -o dist/cai-linux-arm64 ./cmd/cai

          GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w" \
            -o dist/cai-darwin-amd64 ./cmd/cai

          GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w" \
            -o dist/cai-darwin-arm64 ./cmd/cai

          GOOS=windows GOARCH=amd64 \
            go build -ldflags="-s -w" \
            -o dist/cai-windows-amd64.exe ./cmd/cai

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cai-linux-amd64
            dist/cai-linux-arm64
            dist/cai-darwin-amd64
            dist/cai-darwin-arm64
            dist/cai-windows-amd64.exe
            install.sh
